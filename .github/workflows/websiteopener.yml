name: Keep Supabase Project Alive

on:
  schedule:
    # Runs every 3 days at 00:00 UTC — safely under Supabase's 7-day pause threshold
    - cron: '0 0 */3 * *'
  workflow_dispatch: # lets you also trigger it manually from the GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "https://neviffymnvgkwpiyxdam.supabase.co/rest/v1/tracks?select=id&limit=1" \
            -H "apikey: sb_publishable_E16MmYzpkUJVyOTPVCoo9g_cQHKuv6r" \
            -H "Authorization: Bearer sb_publishable_E16MmYzpkUJVyOTPVCoo9g_cQHKuv6r"
